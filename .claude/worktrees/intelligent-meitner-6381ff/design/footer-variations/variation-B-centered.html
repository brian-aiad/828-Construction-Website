<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer Mobile — Variation B: Centered</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; font-family: system-ui, sans-serif; max-width: 390px; margin: 0 auto; }

  footer { text-align: center; padding: 3rem 2rem; }
  .copper-line { height: 1px; background: #B87333; opacity: 0.4; margin-bottom: 3rem; }
  .logo-block { margin-bottom: 2rem; }
  .logo-placeholder { width: 80px; height: 30px; background: rgba(255,255,255,0.1); margin: 0 auto; display: flex; align-items: center; justify-content: center; }
  .logo-placeholder span { font-size: 8px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; }

  .tagline { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.7; margin-bottom: 2.5rem; max-width: 260px; margin-left: auto; margin-right: auto; }

  .phone { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; display: block; text-decoration: none; color: #fff; margin-bottom: 0.5rem; }
  .phone:hover { color: #B87333; }
  .email { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; display: block; margin-bottom: 2.5rem; }

  .cta-btn { display: inline-flex; align-items: center; gap: 0.75rem; background: #B87333; color: #000; padding: 0.9rem 2rem; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; font-weight: 700; margin-bottom: 3rem; }

  .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0 0 2rem; }

  .nav-inline { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1rem; margin-bottom: 2rem; }
  .nav-inline a { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; }
  .nav-inline a:hover { color: rgba(255,255,255,0.8); }

  .address { font-size: 11px; color: rgba(255,255,255,0.3); line-height: 1.6; font-style: normal; margin-bottom: 1.5rem; }
  .copyright { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<footer>
  <div class="copper-line"></div>
  <div class="logo-block">
    <div class="logo-placeholder"><span>828 LOGO</span></div>
  </div>
  <p class="tagline">Building science over guesswork. 20+ years serving South Bay homeowners.</p>
  <a href="tel:+12138282388" class="phone">213-828-2388</a>
  <a href="mailto:joe@828constructions.com" class="email">joe@828constructions.com</a>
  <div><a href="/contact" class="cta-btn">Get a Free Estimate →</a></div>
  <div class="divider"></div>
  <nav class="nav-inline">
    <a href="/">Home</a><a href="/about">About</a><a href="/services">Services</a>
    <a href="/projects">Projects</a><a href="/process">Process</a><a href="/contact">Contact</a>
  </nav>
  <address class="address">21223 Hawthorne Blvd STE B 1087<br>Torrance, CA 90503</address>
  <p class="copyright">© 2025 828 Construction · CA #1141119</p>
</footer>
</body>
</html>
