<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Variation C — Chapter Style with Service Index at Bottom</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; font-family: 'Space Grotesk', sans-serif; }
.hero { position: relative; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
.bg { position: absolute; inset: 0; background: url('/images/services/services-hero.jpg') center/cover no-repeat;
  filter: contrast(1.06) saturate(1.1) brightness(0.92); }
.gradient { position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 40%, rgba(0,0,0,0.75) 100%); }
.top { position: relative; z-index: 10; padding: 32px 48px; }
.eyebrow { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #9ca3af; }
.bottom { position: relative; z-index: 10; padding: 0 48px 48px; }
h1 { font-size: clamp(3rem, 8vw, 8rem); font-weight: 700; line-height: 0.88; letter-spacing: -0.02em; color: #fff; margin-bottom: 40px; }
.service-index { display: flex; gap: 32px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px; }
.svc-item { display: flex; flex-direction: column; gap: 4px; }
.svc-num { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.2em; color: #B87333; text-transform: uppercase; }
.svc-name { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.16em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
</style>
</head>
<body>
<div class="hero">
  <div class="bg"></div>
  <div class="gradient"></div>
  <div class="top"><span class="eyebrow">Services</span></div>
  <div class="bottom">
    <h1>Three Services.<br><span style="color:rgba(255,255,255,0.38)">One Standard.</span></h1>
    <div class="service-index">
      <div class="svc-item"><span class="svc-num">01</span><span class="svc-name">ADU Construction</span></div>
      <div class="svc-item"><span class="svc-num">02</span><span class="svc-name">Remediation</span></div>
      <div class="svc-item"><span class="svc-num">03</span><span class="svc-name">Consulting</span></div>
    </div>
  </div>
</div>
</body>
</html>
