<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Variation A — Large Type, Copper Sweep Button</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; font-family: 'Space Grotesk', sans-serif; }
.cta { padding: 112px 48px; max-width: 1280px; margin: 0 auto; }
.hairline { height: 1px; background: #B87333; opacity: 0.5; width: 80px; margin-bottom: 48px; }
.eyebrow { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: #9ca3af; display: block; margin-bottom: 20px; }
h2 { font-size: clamp(3rem, 6vw, 5.5rem); font-weight: 700; line-height: 0.9; letter-spacing: -0.02em; color: #fff; margin-bottom: 20px; }
.sub { font-size: clamp(1rem, 1.6vw, 1.15rem); color: rgba(255,255,255,0.45); max-width: 520px; line-height: 1.65; margin-bottom: 48px; }
.btns { display: flex; gap: 16px; flex-wrap: wrap; }
.btn-primary { background: #fff; color: #000; padding: 14px 32px;
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn-secondary { border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); padding: 14px 32px;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
</style>
</head>
<body>
<section class="cta" style="background:#000">
  <div class="hairline"></div>
  <span class="eyebrow">Still deciding?</span>
  <h2>Start with a free consultation.</h2>
  <p class="sub">We'll help you figure out exactly what your project requires — no obligation, no sales pressure.</p>
  <div class="btns">
    <a href="#" class="btn-primary">Get Free Estimate →</a>
    <a href="#" class="btn-secondary">213-828-2388</a>
  </div>
</section>
</body>
</html>
